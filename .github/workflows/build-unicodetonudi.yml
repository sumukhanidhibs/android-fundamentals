name: Build UnicodeToNudi APK

on:
  push:
    paths:
      - "UnicodeToNudi/**"
      - ".github/workflows/build-unicodetonudi.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the GitHub Release
    defaults:
      run:
        working-directory: UnicodeToNudi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradle-wrapper.jar is not committed (*.jar is gitignored), so install Gradle directly
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Run unit tests
        run: gradle test --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UnicodeToNudi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UnicodeToNudi-apk
          path: UnicodeToNudi/UnicodeToNudi.apk
          if-no-files-found: error

      # Release assets of a public repo download without signing in.
      # Latest APK is always at: releases/latest/download/UnicodeToNudi.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unicodetonudi-build-${{ github.run_number }}
          name: Unicode to Nudi (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: UnicodeToNudi/UnicodeToNudi.apk
          body: |
            Android app that converts Kannada Unicode text to Nudi.

            Install: download **UnicodeToNudi.apk** below on your phone and tap it.
            Android may ask you to allow installing apps from your browser.

            Built from ${{ github.ref_name }} @ ${{ github.sha }}.
