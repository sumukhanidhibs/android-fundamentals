name: Build UnicodeToNudi

# Builds the Android app and the Windows app, then publishes both in one
# GitHub Release. Release assets of a public repo download without signing in:
#   releases/latest/download/UnicodeToNudi.apk
#   releases/latest/download/UnicodeToNudi.exe

on:
  push:
    paths:
      - "UnicodeToNudi/**"
      - "UnicodeToNudi-Windows/**"
      - ".github/workflows/build-unicodetonudi.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UnicodeToNudi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradle-wrapper.jar is not committed (*.jar is gitignored), so install Gradle directly
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Run unit tests
        run: gradle test --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UnicodeToNudi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UnicodeToNudi-apk
          path: UnicodeToNudi/UnicodeToNudi.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: UnicodeToNudi-Windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Same test data as the Android converter, so both apps give identical Nudi text
      - name: Run converter tests
        run: dotnet run --project tests/NudiConverter.Tests -c Release

      - name: Build Windows app
        # Version 1.0.<build number> shows on the tray icon, so you can tell which build is running
        run: dotnet build src/UnicodeToNudi/UnicodeToNudi.csproj -c Release -o publish -p:Version=1.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: UnicodeToNudi-exe
          path: UnicodeToNudi-Windows/publish/UnicodeToNudi.exe
          if-no-files-found: error

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the GitHub Release

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unicodetonudi-build-${{ github.run_number }}
          name: Unicode to Nudi (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/UnicodeToNudi.apk
            dist/UnicodeToNudi.exe
          body: |
            Converts Kannada Unicode text to Nudi.

            **Android:** download **UnicodeToNudi.apk** on your phone and tap it to install.

            **Windows:** download **UnicodeToNudi.exe** and run it. It runs in the background
            (icon near the clock). Select Kannada text in Microsoft Word and press **Ctrl+Alt+N**.
            Windows may show "Windows protected your PC" because the app is not signed:
            click **More info** → **Run anyway**.

            Built from ${{ github.ref_name }} @ ${{ github.sha }}.
