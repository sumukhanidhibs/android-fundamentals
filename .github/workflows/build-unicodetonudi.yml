name: Build UnicodeToNudi APK

on:
  push:
    paths:
      - "UnicodeToNudi/**"
      - ".github/workflows/build-unicodetonudi.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UnicodeToNudi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradle-wrapper.jar is not committed (*.jar is gitignored), so install Gradle directly
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Run unit tests
        run: gradle test --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: UnicodeToNudi-apk
          path: UnicodeToNudi/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
