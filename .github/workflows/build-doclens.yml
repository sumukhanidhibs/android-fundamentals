name: Build DocLens

# Builds the DocLens PDF viewer and publishes the APK in a GitHub Release.
# The release keeps a fixed tag so the download link never changes:
#   releases/download/doclens-latest/DocLens.apk
# (It is not marked "latest", so the UnicodeToNudi links keep working.)

on:
  push:
    paths:
      - "DocLens/**"
      - ".github/workflows/build-doclens.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the GitHub Release
    defaults:
      run:
        working-directory: DocLens

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradle-wrapper.jar is not committed (*.jar is gitignored), so install Gradle directly
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Run unit tests
        run: gradle test --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DocLens.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DocLens-apk
          path: DocLens/DocLens.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: doclens-latest
          name: DocLens PDF viewer
          make_latest: false
          overwrite_files: true
          files: DocLens/DocLens.apk
          body: |
            DocLens: a fast PDF viewer for Android.

            Download **DocLens.apk** on your phone and tap it to install.
            Then open DocLens → **Allow access** to list every PDF on the phone, and
            **Set as default** so PDFs from WhatsApp, Gmail and Downloads open in DocLens.

            Latest build: ${{ github.ref_name }} @ ${{ github.sha }} (run ${{ github.run_number }}).
